<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>+&</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#f5f7ff; background:
  radial-gradient(circle at 20% 10%,#293b72 0,transparent 35%),
  radial-gradient(circle at 90% 90%,#40245f 0,transparent 35%),#0a0d17;
  padding:20px;
}
.card{
  width:min(920px,100%); background:rgba(18,23,39,.82);
  border:1px solid rgba(255,255,255,.1); border-radius:28px;
  padding:32px; box-shadow:0 25px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}
h1{margin:0 0 8px;font-size:clamp(30px,6vw,52px)}
.sub{margin:0 0 26px;color:#aab3ca}
.top{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
button{
  border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:800;
  color:white;background:linear-gradient(135deg,#6675ff,#9b55ff);cursor:pointer;
  box-shadow:0 8px 25px rgba(111,91,255,.3);transition:.18s transform,.18s filter;
}
button:hover{transform:translateY(-2px);filter:brightness(1.08)}
button:active{transform:translateY(0)}
.stats{margin-left:auto;color:#aab3ca}.stats b{color:white}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:26px}
.word{
  min-height:76px;display:flex;align-items:center;justify-content:center;
  padding:12px;border-radius:16px;background:#151b2c;border:1px solid #252d46;
  font-weight:750;word-break:break-word;text-align:center;transition:.25s;
}
.word.marker{
  color:#fff;background:linear-gradient(135deg,#ff2f6d,#ff8a3d);
  border-color:#ff7197;box-shadow:0 0 30px rgba(255,67,117,.65);
  animation:pulse .8s infinite alternate;
}
@keyframes pulse{to{transform:scale(1.035);box-shadow:0 0 45px rgba(255,67,117,.9)}}
.notice{
  display:none;margin-top:18px;padding:14px 16px;border-radius:14px;
  background:rgba(255,55,110,.12);border:1px solid rgba(255,100,140,.35);color:#ffb8ca;
}
.notice.show{display:block}
.footer{margin-top:22px;color:#69738c;font-size:13px;line-height:1.5}
@media(max-width:650px){.card{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.stats{margin-left:0;width:100%}}
</style>
</head>
<body>
<main class="card">
  <h1>~@•@Ц ?:+?</h1>
  <p class="sub">~@•@Ц 10 элементов.</p>
  <div class="top">
    <button id="generate">⚡ ~@•@Ц</button>
    <div class="stats">~@•@Ц: <b id="count">0</b></div>
  </div>
  <section class="grid" id="grid"></section>
  <div class="notice" id="notice">Н</div>
  
</main>
<script>
const MARKER = "ГШЦШГ";
const CHANCE_DENOMINATOR = 1_000_000;
const WORDS = [
  "apple",
  "river",
  "shadow",
  "planet",
  "forest",
  "window",
  "silver",
  "orange",
  "winter",
  "summer",
  "thunder",
  "crystal",
  "bridge",
  "garden",
  "signal",
  "memory",
  "galaxy",
  "candle",
  "ocean",
  "mountain",
  "whisper",
  "mirror",
  "castle",
  "dragon",
  "puzzle",
  "secret",
  "cloud",
  "rainbow",
  "stone",
  "coffee",
  "paper",
  "flower",
  "button",
  "rocket",
  "dream",
  "storm",
  "sunlight",
  "night",
  "morning",
  "library",
  "machine",
  "comet",
  "island",
  "violet",
  "golden",
  "velvet",
  "flame",
  "feather",
  "anchor",
  "bottle",
  "pencil",
  "pocket",
  "ticket",
  "circle",
  "square",
  "yellow",
  "purple",
  "quiet",
  "bright",
  "gentle",
  "frozen",
  "little",
  "happy",
  "silent",
  "wild",
  "ancient",
  "future",
  "hidden",
  "random",
  "binary",
  "cipher",
  "message",
  "code",
  "key",
  "lock"
];

// Один вызов выбирает один элемент, как get_item() в Python.
function getItem(){
  // Генерация случайного результата.
  if (Math.floor(Math.random() * CHANCE_DENOMINATOR) === 0) return MARKER;
  return WORDS[Math.floor(Math.random() * WORDS.length)];
}

let generations = 0;
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const notice = document.getElementById("notice");

function generate(){
  generations++;
  count.textContent = generations;
  grid.innerHTML = "";
  let found = false;

  for(let i=0;i<10;i++){
    const value = getItem();
    const cell = document.createElement("div");
    cell.className = "word" + (value === MARKER ? " marker" : "");
    cell.textContent = value;
    grid.appendChild(cell);
    if(value === MARKER) found = true;
  }
  notice.classList.remove("show");
}

document.getElementById("generate").addEventListener("click", generate);
generate();
</script>
</body>
</html>
